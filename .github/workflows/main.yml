name: Build GameBoy WebAssembly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto y submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: main

      - name: Crear carpeta ROMs
        run: mkdir -p ROMs

      - name: Compilar GameBoy
        shell: bash
        run: |
          set -o pipefail

          echo "========== CONFIGURANDO PROYECTO =========="
          cmake -B build -DCMAKE_BUILD_TYPE=Release

          echo "========== COMPILANDO =========="
          cmake --build build --parallel 1 --verbose 2>&1 | tee build.log || {
            echo ""
            echo "========== POSIBLES ERRORES =========="
            grep -niE "error:|fatal:|undefined|not found|no such file|FAILED|Error [0-9]+" build.log | tail -n 100 || true

            echo ""
            echo "========== ULTIMAS 250 LINEAS =========="
            tail -n 250 build.log

            exit 1
          }

      - name: Verificar archivos WebAssembly
        run: |
          echo "Buscando gameboy.js..."
          test -f www/static/gameboy.js

          echo "Buscando gameboy.wasm..."
          test -f www/static/gameboy.wasm

          echo "Archivos encontrados:"
          ls -lh www/static/gameboy.js
          ls -lh www/static/gameboy.wasm

      - name: Guardar archivos compilados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f www/static/gameboy.js
          git add -f www/static/gameboy.wasm

          if git diff --cached --quiet; then
            echo "Los archivos ya estaban actualizados."
          else
            git commit -m "Build GameBoy WebAssembly"
            git push origin HEAD:main
          fi
